<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мафия Онлайн</title>
  <link rel="stylesheet" href="css/app.css?v=9">
</head>
<body>

  <!-- Навигационная панель -->
  <header class="navbar">
    <div class="brand">
      <span>🕵️ МАФИЯ ОНЛАЙН</span>
      <span class="brand-badge" id="brandBadge">10 МЕСТ</span>
    </div>

    <div class="nav-actions">
      <button id="btnToggleMic" class="btn btn-gold" style="width: auto; padding: 6px 14px;">🎙️ Разрешить микрофон</button>
      <button id="btnToggleMute" class="btn" style="width: auto; padding: 6px 12px;">🔊 Звук: ВКЛ</button>
      <div class="user-profile">
        <span class="status-indicator"></span>
        <span id="nicknameDisplay">Загрузка...</span>
        <button id="btnChangeNick" class="btn" style="width: auto; padding: 2px 8px; font-size: 0.75rem; background: #334155;">Сменить</button>
      </div>
    </div>
  </header>

  <!-- Информационная полоса запроса микрофона -->
  <div id="micPromptBar" class="mic-prompt-bar" style="display: none;">
    <span>🎙️ Разрешите доступ к микрофону для голосовой связи с игроками за столом.</span>
    <button id="btnGrantMic" class="btn btn-gold" style="width: auto; padding: 4px 12px; font-size: 0.85rem;">Включить микрофон</button>
  </div>

  <!-- Основная игровая зона -->
  <main class="game-container">
    
    <div class="table-area">
      <!-- Баннер текущей фазы и таймер -->
      <section class="phase-banner">
        <div class="phase-info">
          <h2 id="phaseTitle">Подключение к серверу...</h2>
          <p id="phaseDescription">Подождите, идет синхронизация стола.</p>
        </div>

        <div class="timer-box">
          <div class="timer-value" id="timerValue">0</div>
          <div class="timer-label">СЕКУНД</div>
        </div>
      </section>

      <!-- Настройки стола в лобби (выбор режимов и количества мест) -->
      <section class="lobby-settings-bar" id="lobbySettingsBar" style="display: none;">
        <div class="lobby-size-control">
          <label for="tableSizeSelect">👥 Режим стола:</label>
          <select id="tableSizeSelect" class="table-size-select">
            <option value="2_peaceful">🛠️ ТЕСТ: 2 Мирных (проверка дневного звука)</option>
            <option value="2_mafia">🛠️ ТЕСТ: 2 Мафии (проверка ночной договорки)</option>
            <option value="4">4 игрока ⚡ ТЕСТ (2 Мафии, 1 Шериф, 1 Мирный)</option>
            <option value="5">5 игроков (1 Мафия/Дон, 1 Шериф, 3 Мирных)</option>
            <option value="6">6 игроков (1 Мафия/Дон, 1 Шериф, 4 Мирных)</option>
            <option value="7">7 игроков (2 Мафии, 1 Шериф, 4 Мирных)</option>
            <option value="8">8 игроков (2 Мафии, 1 Шериф, 5 Мирных)</option>
            <option value="9">9 игроков (3 Мафии, 1 Шериф, 5 Мирных)</option>
            <option value="10" selected>10 игроков ★ Классика (3 Мафии, 1 Шериф, 6 Мирных)</option>
            <option value="11">11 игроков (3 Мафии, 1 Шериф, 7 Мирных)</option>
            <option value="12">12 игроков (4 Мафии, 1 Шериф, 7 Мирных)</option>
          </select>
        </div>
      </section>

      <!-- Игровой стол (2-12 мест) -->
      <section class="seats-grid" id="seatsGrid">
        <!-- Генерируется динамически через app.js -->
      </section>

      <!-- Нижняя панель действий (HUD) -->
      <section class="hud-bar">
        <div class="role-reveal-box" id="roleCard" style="display: none;">
          <span style="color: var(--text-muted); font-size: 0.85rem;">Ваша роль:</span>
          <div id="myRoleTitle" class="player-role-badge">Мирный житель</div>
        </div>

        <div class="hud-buttons" id="hudActions">
          <!-- Динамические кнопки (Запустить игру, Завершить речь и т.д.) -->
        </div>
      </section>
    </div>

    <!-- Боковая панель событий (Лог стола) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>📜 ХРОНИКА ГОРОДА</span>
      </div>
      <div class="event-log" id="eventLog">
        <!-- События игры -->
      </div>
    </aside>

  </main>

  <!-- Модальное окно смены никнейма -->
  <div class="modal-overlay" id="modalNickname" style="display: none;">
    <div class="modal-card">
      <h3>Ваш никнейм за столом</h3>
      <input type="text" id="inputNickname" class="input-text" maxlength="20" placeholder="Введите имя..." />
      <div style="display: flex; gap: 10px;">
        <button id="btnSaveNick" class="btn btn-primary">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Скрипты -->
  <script src="js/signalr.min.js"></script>
  <script src="js/audio.js?v=14"></script>
  <script src="js/voice.js?v=14"></script>
  <script src="js/app.js?v=14"></script>
</body>
</html>
